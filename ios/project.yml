name: AirPoint
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  AirPoint:
    type: application
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - Sources
      - path: Identity/identity.p12
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitbyteco.AirPoint
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AirPoint
        NSLocalNetworkUsageDescription: Find Google TV devices running AirPoint and send them pointer movement.
        NSBonjourServices: ["_airpoint._udp"]
        NSMotionUsageDescription: Turn the phone's movement into a pointer on your TV.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
